# A local Conduit for Part 2 on http://localhost:3000: Postgres and the app built from source, no rate limit.
# From the root: npm run conduit:local (up --build), npm run conduit:local:down.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
      POSTGRES_DB: conduit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      JWT_KEY: qa-automation-showcase-local
      PROD_DB_USERNAME: conduit
      PROD_DB_PASSWORD: conduit
      PROD_DB_NAME: conduit
      PROD_DB_HOSTNAME: db
      PROD_DB_DIALECT: postgres
    ports:
      - "3000:3001"
